/* Arden lockup */
.brandmark{background-image:var(--logo);background-size:contain;background-repeat:no-repeat;
  background-position:left center;display:block}
.brandmark--top{width:150px;height:52px;flex:none}
.brandmark--home{width:clamp(210px,22vw,290px);height:100px;margin-bottom:22px}
.brandmark--crew{width:104px;height:36px;flex:none}
.brandmark--sum{width:132px;height:46px;flex:none}

*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--enclosure);
  color:var(--white-wire);
  font-family:var(--body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ph-c);outline-offset:2px}
.hide{display:none !important}

.eyebrow{
  font-family:var(--data);font-size:11px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--label);
}
.stencil{
  font-family:var(--display);font-weight:900;
  letter-spacing:.02em;text-transform:uppercase;line-height:.92;
}

/* engraved nameplate look used on headers */
.nameplate{
  background:linear-gradient(180deg,#202934,#171e27);
  border:1px solid var(--edge);
  border-top-color:#42505f;
  border-radius:var(--r);
}

/* ============================================================
   HOME / SETUP
   ============================================================ */
.home{max-width:1100px;margin:0 auto;padding:48px 22px 90px}
.home__hero{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;margin-bottom:54px}
@media(max-width:860px){.home__hero{grid-template-columns:1fr;gap:26px}}
.home h1{font-family:var(--display);font-weight:900;text-transform:uppercase;
  font-size:clamp(46px,7vw,84px);line-height:.86;margin:10px 0 16px;letter-spacing:-.01em}
.home h1 em{font-style:normal;color:var(--ph-c);}
.home__lede{font-size:17px;line-height:1.6;color:#c3cedb;max-width:52ch}
.home__art{position:relative;min-height:230px}

.setup{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:860px){.setup{grid-template-columns:1fr}}
.card{background:var(--deadfront);border:1px solid var(--edge);border-radius:var(--r);padding:22px}
.card h2{font-family:var(--display);font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;font-size:20px;margin:0 0 4px}
.card p.sub{margin:0 0 18px;font-size:14px;color:var(--label);line-height:1.5}

.field{margin-bottom:16px}
.field label{display:block;font-family:var(--data);font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--label);margin-bottom:6px}
.field input,.field select{
  width:100%;padding:11px 12px;background:#0d1219;color:var(--white-wire);
  border:1px solid var(--edge);border-radius:var(--r);font-family:var(--data);font-size:14px}
.hint{font-size:12px;color:#71829a;margin-top:6px;line-height:1.45}

.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px;margin-top:6px}
.pick{
  display:flex;align-items:center;gap:9px;padding:9px 10px;text-align:left;
  background:#0d1219;border:1px solid var(--edge);border-radius:var(--r);
  font-size:13px;font-weight:500;color:#a9b7c7;transition:.14s}
.pick svg{width:19px;height:19px;flex:none;color:var(--label)}
.pick[aria-pressed="true"]{border-color:var(--ph-c);color:var(--white-wire);background:#1d222a}
.pick[aria-pressed="true"] svg{color:var(--ph-c)}
.pick .ckt{font-family:var(--data);font-size:10px;color:#5f7085;margin-left:auto}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:13px 20px;border-radius:var(--r);border:1px solid var(--edge);
  background:var(--gutter);font-family:var(--display);font-weight:700;
  text-transform:uppercase;letter-spacing:.09em;font-size:15px;transition:.14s}
.btn:hover{border-color:#5c6d80;background:#2a3543}
.btn--go{background:var(--ph-c);color:#fff;border-color:var(--ph-c)}
.btn--go:hover{background:#0a82d4;border-color:#0a82d4}
.btn--ghost{background:transparent}
.btn--sm{padding:8px 13px;font-size:12px;letter-spacing:.07em}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}

/* ============================================================
   PRESENTER — the panelboard
   ============================================================ */
.pv{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;position:relative}

.pv__top{
  display:flex;align-items:center;gap:18px;padding:12px 22px;
  border-bottom:1px solid var(--edge);background:var(--deadfront);flex:none}
.pv__id{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:22px;letter-spacing:.04em}
.pv__id span{color:var(--ph-c)}
.pv__room{font-family:var(--data);font-size:13px;color:var(--label);letter-spacing:.14em}
.pv__spacer{flex:1}
.pv__stat{font-family:var(--data);font-size:12px;color:var(--label);letter-spacing:.1em;text-transform:uppercase}
.pv__stat b{color:var(--white-wire);font-size:15px}
.link-led{width:9px;height:9px;border-radius:50%;background:var(--trip);display:inline-block;margin-right:7px;vertical-align:1px}
.link-led.on{background:var(--ground);box-shadow:0 0 10px var(--ground)}

.pv__body{flex:1;display:grid;grid-template-columns:392px 1fr;gap:0;min-height:0}
@media(max-width:1100px){.pv__body{grid-template-columns:1fr}}

/* --- left: the tool now on screen + its QR --- */
.pv__stage{padding:24px 24px 20px;min-height:0;display:flex;flex-direction:column;overflow:hidden;
  border-right:1px solid var(--edge);background:linear-gradient(180deg,#14161a,#101215)}
.pv__ckt{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.pv__ckt .no{font-family:var(--data);font-size:12px;color:var(--ph-c);letter-spacing:.2em}
.pv__ckt .of{font-family:var(--data);font-size:11px;color:#5f7085;letter-spacing:.14em}
.pv__tool{display:flex;align-items:center;gap:13px;margin-bottom:12px}
.pv__tool svg{width:clamp(36px,3vw,46px);height:clamp(36px,3vw,46px);color:var(--ph-c);flex:none}
.pv__tool h2{font-family:var(--display);font-weight:900;text-transform:uppercase;
  font-size:clamp(30px,3.2vw,46px);line-height:.9;margin:0;letter-spacing:-.005em}
.pv__blurb{font-size:clamp(14px,1.05vw,17px);line-height:1.5;color:#c9d4e0;margin:0 0 14px}

.fieldnote{
  border-left:3px solid var(--ph-c);background:linear-gradient(90deg,rgba(8,112,184,.14),transparent 78%);
  padding:12px 15px;border-radius:0 var(--r) var(--r) 0}
.fieldnote .eyebrow{color:var(--ph-c);margin-bottom:5px;display:block}
.fieldnote p{margin:0;font-size:clamp(14px,1.05vw,17px);line-height:1.5;color:#e2e9f1}

.shot{margin-top:14px;border:1px solid var(--edge);border-radius:var(--r);background:#0d1116;
  min-height:0;display:none;align-items:center;justify-content:center;overflow:hidden;position:relative}
.shot.has{display:flex;flex:0 0 auto;max-height:34%}
.shot img{width:100%;height:100%;object-fit:contain;display:block}
.shot .empty{font-family:var(--data);font-size:11px;color:#3f4d5e;letter-spacing:.16em;text-align:center;padding:16px}

/* QR block pinned to the bottom of the left column */
.qrblock{margin-top:auto;display:flex;align-items:center;gap:16px;padding-top:16px;border-top:1px solid var(--edge)}
.qrframe{background:#fff;padding:11px;border-radius:var(--r);line-height:0;flex:none;
  box-shadow:0 0 0 1px var(--edge),0 12px 34px rgba(0,0,0,.5)}
.qrframe img,.qrframe canvas{display:block;width:clamp(120px,12vw,158px);height:auto;image-rendering:pixelated}
.qrblock__txt{min-width:0}
.pv__scanmsg{font-family:var(--display);font-weight:900;text-transform:uppercase;letter-spacing:.02em;
  font-size:clamp(20px,1.8vw,27px);line-height:.95;margin-bottom:6px}
.pv__scanmsg em{font-style:normal;color:var(--ph-c)}
.pv__scanhint{font-size:13px;color:var(--label);line-height:1.45}
.qrwarn{background:var(--trip);color:#fff;padding:10px 13px;border-radius:var(--r);
  font-size:13px;line-height:1.45;margin-bottom:10px}
.qrwarn b{display:block;font-family:var(--display);font-weight:900;text-transform:uppercase;
  letter-spacing:.05em;font-size:15px;margin-bottom:3px}
.pv__url{font-family:var(--data);font-size:10px;color:#5c6675;word-break:break-all;line-height:1.5;margin-top:8px}
.roomcode{font-family:var(--data);font-weight:600;font-size:34px;letter-spacing:.3em;color:var(--ph-c);
  text-align:center;padding-left:.3em}

.tally{width:100%;margin-top:auto;border-top:1px solid var(--edge);padding-top:14px}
.tally__row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.tally__row .eyebrow{letter-spacing:.16em}
.tally__num{font-family:var(--data);font-size:28px;font-weight:600}
.meter{height:9px;background:#0d1219;border:1px solid var(--edge);border-radius:2px;overflow:hidden}
.meter>i{display:block;height:100%;background:var(--ground);transition:width .5s cubic-bezier(.2,.8,.2,1)}

/* --- bottom: the bus + breakers --- */
.pv__bus{flex:none;border-top:1px solid var(--edge);background:#0e131a;padding:0 14px 12px;position:relative}
.busbar{height:8px;margin:0 6px;position:relative;
  background:linear-gradient(180deg,#3d4a59,#222c37);border-radius:2px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14);overflow:hidden}
.busbar::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(43,147,214,.55),transparent);
  transform:translateX(-100%);animation:current 5.5s linear infinite}
@keyframes current{to{transform:translateX(100%)}}
.breakers{display:flex;gap:6px;padding-top:10px;align-items:stretch}
.brk{
  flex:1;min-width:0;background:var(--gutter);border:1px solid var(--edge);
  border-top:3px solid #3b4757;border-radius:0 0 var(--r) var(--r);
  padding:7px 6px 8px;display:flex;flex-direction:column;gap:5px;
  position:relative;transition:.25s;text-align:left}
.brk__hd{display:flex;align-items:center;gap:5px;min-width:0}
.brk__hd svg{width:15px;height:15px;flex:none;color:var(--label)}
.brk__name{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:13px;
  letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#b6c3d2}
.brk__gauge{display:flex;align-items:center;gap:6px}
.brk__gauge svg{width:34px;height:20px;flex:none}
.brk__n{font-family:var(--data);font-size:11px;color:#6d7f95}
.brk__bar{height:4px;background:#0d1219;border-radius:2px;overflow:hidden}
.brk__bar>i{display:block;height:100%;width:0;background:var(--ground);transition:width .6s}
.brk[data-state="live"]{border-top-color:var(--ph-c)}
.brk[data-state="live"] .brk__name{color:var(--white-wire)}
.brk[data-state="trip"]{border-top-color:var(--trip);background:#2a1c1e}
.brk[data-state="trip"] .brk__name{color:#ffb3ad}
.brk[data-state="trip"] .brk__bar>i{background:var(--trip)}
.brk[data-state="ok"]{border-top-color:var(--ground)}
.brk.is-current{background:#2b3442;box-shadow:0 0 0 1px var(--ph-c) inset}
.brk__flash{position:absolute;inset:0;background:var(--ph-c);opacity:0;pointer-events:none;border-radius:0 0 var(--r) var(--r)}

/* ---- live dashboard ---- */
.dash{display:flex;flex-direction:column;gap:14px;min-height:0;padding:22px 26px 8px}
.dash__cards{display:grid;grid-template-columns:1.15fr .95fr .95fr;gap:12px;flex:none}
.statcard{background:var(--deadfront);border:1px solid var(--edge);border-radius:var(--r);
  padding:13px 15px;display:flex;flex-direction:column;justify-content:space-between;min-height:104px;position:relative;overflow:hidden}
.statcard .lab{font-family:var(--data);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--label)}
.statcard .big{font-family:var(--display);font-weight:900;line-height:.85;letter-spacing:-.01em}
.statcard--ans .big{font-size:clamp(34px,4.2vw,58px)}
.statcard--ans .big small{font-size:.42em;color:var(--label);font-weight:700;letter-spacing:.02em}
.statcard__spark{position:absolute;right:12px;top:12px;font-family:var(--data);font-size:10px;letter-spacing:.1em;color:var(--ph-c);opacity:0}
.statcard__spark.live{animation:ping 1.1s ease-out}
@keyframes ping{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-10px)}}

.dial{display:flex;align-items:center;gap:12px}
.dial svg{width:78px;height:78px;flex:none}
.dial__ring{fill:none;stroke:#0d1116;stroke-width:8}
.dial__val{fill:none;stroke-width:8;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;
  transition:stroke-dasharray .7s cubic-bezier(.2,.8,.2,1),stroke .5s}
.dial__pct{font-family:var(--display);font-weight:900;font-size:26px}
.dial__cap{font-size:12px;color:var(--label);line-height:1.35}

.gauge{display:flex;align-items:center;gap:12px}
.gauge svg{width:96px;height:58px;flex:none}
.gauge__needle{transition:transform .7s cubic-bezier(.2,.8,.2,1);transform-origin:48px 50px}
.gauge__read{font-family:var(--display);font-weight:900;font-size:26px;line-height:.9}
.gauge__cap{font-size:12px;color:var(--label)}

.seatpanel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--deadfront);
  border:1px solid var(--edge);border-radius:var(--r);padding:14px 15px}
.seatpanel__hd{display:flex;align-items:baseline;gap:10px;margin-bottom:11px;flex:none}
.seatpanel__hd .t{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:15px}
.seatpanel__hd .c{font-family:var(--data);font-size:12px;color:var(--label);margin-left:auto}
.seatpanel__hd .lg{display:flex;gap:12px;font-family:var(--data);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--label)}
.seatpanel__hd .lg i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:0}
.seatgrid{flex:1;min-height:0;display:grid;gap:6px;align-content:start;overflow:hidden}
.seat{border-radius:3px;background:#0d1116;border:1px solid #262d36;aspect-ratio:1;position:relative;transition:background .2s,border-color .2s}
.seat[data-s="right"]{background:var(--ground);border-color:var(--ground)}
.seat[data-s="wrong"]{background:var(--trip);border-color:var(--trip)}
.seat[data-s="wrong"]::after{content:"";position:absolute;left:50%;top:50%;width:52%;height:2px;background:#fff;opacity:.9;border-radius:1px;transform:translate(-50%,-50%) rotate(-45deg)}
.seat.pop{animation:seatpop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes seatpop{0%{transform:scale(.2);opacity:.2}60%{transform:scale(1.18)}100%{transform:scale(1)}}

.histo{flex:none;background:var(--deadfront);border:1px solid var(--edge);border-radius:var(--r);padding:12px 15px 10px}
.histo__hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.histo__hd .t{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:15px}
.histo__hd .s{font-family:var(--data);font-size:11px;color:var(--label)}
.histo__bars{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:end;height:clamp(76px,9vw,128px)}
.hcol{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.hcol .track{width:100%;flex:1;display:flex;align-items:flex-end;background:#0d1116;border-radius:3px 3px 0 0;overflow:hidden}
.hcol .fill{width:100%;height:0;border-radius:3px 3px 0 0;transition:height .6s cubic-bezier(.2,.8,.2,1)}
.hcol.bump .fill{animation:hbump .5s ease-out}
@keyframes hbump{0%{filter:brightness(1.8)}100%{filter:brightness(1)}}
.hcol .n{font-family:var(--data);font-size:12px;color:var(--white-wire);font-weight:600}
.hcol .cap{font-size:10px;color:var(--label);text-align:center;line-height:1.15;min-height:2.3em;letter-spacing:.02em}

.spark{position:fixed;width:11px;height:11px;border-radius:50%;background:var(--ph-c);
  box-shadow:0 0 16px 5px rgba(43,147,214,.8);pointer-events:none;z-index:60}
.namepop{position:fixed;font-family:var(--display);font-weight:700;text-transform:uppercase;
  font-size:15px;letter-spacing:.05em;color:var(--ph-c);pointer-events:none;z-index:61;white-space:nowrap;
  text-shadow:0 2px 12px rgba(0,0,0,.9)}

.ctlbar{position:fixed;right:18px;top:64px;display:flex;flex-direction:column;gap:7px;z-index:70;opacity:.25;transition:.2s}
.ctlbar:hover,.ctlbar:focus-within{opacity:1}
@media(max-width:1100px){.ctlbar{opacity:1}}

/* ============================================================
   SUMMARY — panel schedule
   ============================================================ */
.sum{position:fixed;inset:0;background:var(--enclosure);z-index:80;overflow-y:auto;padding:24px 30px 80px}
.sum__hd{display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  border-bottom:2px solid var(--ph-c);padding-bottom:14px;margin-bottom:20px}
.sum__hd h2{font-family:var(--display);font-weight:900;text-transform:uppercase;
  font-size:clamp(26px,3.4vw,44px);line-height:.9;margin:0}
.sum__acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* headline numbers */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:10px;margin-bottom:28px}
.kpi{background:var(--deadfront);border:1px solid var(--edge);border-radius:var(--r);padding:13px 15px}
.kpi .lab{font-family:var(--data);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--label);display:block;margin-bottom:7px}
.kpi .v{font-family:var(--display);font-weight:900;font-size:clamp(28px,3vw,40px);line-height:.88;
  letter-spacing:-.01em;display:block}
.kpi .v small{font-size:.44em;color:var(--label);font-weight:700;letter-spacing:.02em}
.kpi .sub{font-size:12px;color:var(--label);margin-top:6px;line-height:1.4;display:block}
.kpi--alert{border-color:#5e2226;background:#1d1416}
.kpi--alert .v{color:#ff8f88}
.kpi--good .v{color:#7cebac}

/* section headers */
.sec{margin-bottom:30px}
.sec__hd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:13px}
.sec__hd h3{font-family:var(--display);font-weight:900;text-transform:uppercase;
  font-size:clamp(19px,2.1vw,26px);letter-spacing:.02em;margin:0;line-height:1}
.sec__hd .s{font-size:13px;color:var(--label);line-height:1.45;max-width:62ch}
.sec__split{display:grid;grid-template-columns:1.5fr 1fr;gap:24px;align-items:start}
@media(max-width:1040px){.sec__split{grid-template-columns:1fr}}

/* the training plan — the deliverable */
.plan{display:grid;grid-template-columns:repeat(auto-fill,minmax(345px,1fr));gap:12px}
.pcard{background:var(--deadfront);border:1px solid var(--edge);border-left:4px solid var(--edge);
  border-radius:var(--r);padding:14px 16px 15px;display:flex;flex-direction:column;gap:10px}
.pcard--p1{border-left-color:var(--trip)}
.pcard--p2{border-left-color:var(--warn)}
.pcard--p3{border-left-color:var(--ground)}
.pcard__top{display:flex;align-items:center;gap:10px}
.pcard__rank{font-family:var(--data);font-size:12px;color:#5f7085;flex:none}
.pcard__nm{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:21px;
  letter-spacing:.02em;line-height:1}
.pcard__tag{margin-left:auto}
.pcard__nums{display:flex;gap:15px;flex-wrap:wrap;font-family:var(--data);font-size:11px;
  letter-spacing:.06em;color:#7d8b9c;text-transform:uppercase}
.pcard__nums b{color:var(--white-wire);font-weight:600;font-size:13px;letter-spacing:0}
.pcard__act{font-size:14px;line-height:1.55;color:#dde5ee}
.pcard__miss{font-size:13px;line-height:1.45;background:#0d1116;border-radius:3px;padding:9px 11px;color:#c3cedb}
.pcard__miss b{display:block;font-family:var(--data);font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:#ff8f88;margin-bottom:4px;font-weight:500}
.pcard__miss i{font-style:normal;color:#7d8b9c}

/* results table */
table.sched{width:100%;border-collapse:collapse;font-size:14px}
table.sched th{font-family:var(--data);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--label);text-align:left;padding:8px 9px;border-bottom:1px solid var(--edge);white-space:nowrap}
table.sched td{padding:9px;border-bottom:1px solid #1e2630;vertical-align:middle}
table.sched tr:hover td{background:#161d26}
.sched__nm{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:16px;letter-spacing:.03em}
.sched__ckt{font-family:var(--data);font-size:11px;color:#5f7085}
.pillbar{display:flex;align-items:center;gap:8px}
.pillbar .track{width:70px;height:7px;background:#0d1116;border-radius:2px;overflow:hidden;flex:none}
.pillbar .track>i{display:block;height:100%}
.pillbar .val{font-family:var(--data);font-size:12px;color:#98a8bb;min-width:34px}
.tag{font-family:var(--data);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  padding:4px 8px;border-radius:2px;border:1px solid;white-space:nowrap;display:inline-block}
.tag--trip{color:#ff8f88;border-color:#7d2b26;background:#2a1618}
.tag--watch{color:#ffdf7a;border-color:#7a6413;background:#26210f}
.tag--ok{color:#7cebac;border-color:#1f6b42;background:#12241a}
.tag--none{color:#7d8b9c;border-color:#2f3d4a;background:#161d25}

/* generic panel */
.panel{background:var(--deadfront);border:1px solid var(--edge);border-radius:var(--r);padding:15px 16px;margin-bottom:16px}
.panel h4{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  font-size:16px;margin:0 0 3px}
.panel p.sub{font-size:12.5px;color:var(--label);margin:0 0 13px;line-height:1.45}

/* blind spots */
.blind{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid #1e2630}
.blind:last-child{border-bottom:none}
.blind__n{font-family:var(--display);font-weight:900;font-size:24px;line-height:1;color:#ff8f88;
  min-width:44px;text-align:right}
.blind__nm{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:15px;letter-spacing:.03em}
.blind__s{font-size:12px;color:var(--label);line-height:1.35}

/* room split */
.split__row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.split__lbl{font-family:var(--data);font-size:11px;color:#98a8bb;width:78px;flex:none;letter-spacing:.04em}
.split__track{flex:1;height:20px;background:#0d1116;border-radius:2px;overflow:hidden}
.split__track>i{display:block;height:100%;transition:width .6s}
.split__n{font-family:var(--data);font-size:12px;color:var(--label);width:58px;text-align:right}

/* friction */
.pp{display:flex;align-items:center;gap:11px;margin-bottom:7px}
.pp__lbl{font-size:13px;width:158px;flex:none;color:#c3cedb}
.pp__track{flex:1;height:16px;background:#0d1116;border-radius:2px;overflow:hidden}
.pp__track>i{display:block;height:100%;background:linear-gradient(90deg,var(--ph-a),var(--ph-b));transition:width .7s}
.pp__n{font-family:var(--data);font-size:12px;color:var(--label);width:26px;text-align:right}

/* quotes */
.quotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.quote{background:var(--deadfront);border:1px solid var(--edge);border-left:3px solid var(--ph-c);
  border-radius:0 var(--r) var(--r) 0;padding:12px 14px;font-size:14px;line-height:1.5;color:#d6dfe9}
.quote b{display:block;font-family:var(--data);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--label);margin-bottom:5px;font-weight:500}

.emptyline{font-size:13px;color:#5f7085;line-height:1.5}

/* print / save as PDF */
@media print{
  @page{margin:14mm}
  body{background:#fff}
  .pv,.ctlbar,.toast,.sum__acts{display:none !important}
  .sum{position:static;background:#fff;color:#111;overflow:visible;padding:0}
  .sum__hd{border-bottom-color:#0870b8}
  .sum__hd h2,.pcard__nm,.sched__nm,.kpi .v,.sec__hd h3,.blind__nm{color:#111}
  .kpi,.panel,.pcard,.quote{background:#fff;border-color:#c8d0d8;break-inside:avoid}
  .pcard__miss{background:#f3f5f8;color:#333}
  .pcard__act,.quote,.sec__hd .s,.kpi .sub{color:#333}
  table.sched td{border-bottom-color:#dde3e9;color:#222}
  .brandmark{filter:invert(1) hue-rotate(180deg)}
  .sec{break-inside:avoid}
}

/* ============================================================
   CREW — the phone side. Built like a field ticket.
   ============================================================ */
.cv{max-width:560px;margin:0 auto;padding:18px 16px 40px;min-height:100dvh}
.cv__hd{display:flex;align-items:center;gap:11px;padding-bottom:13px;border-bottom:1px solid var(--edge);margin-bottom:20px}
.cv__hd .mark{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:17px;letter-spacing:.05em}
.cv__hd .mark span{color:var(--ph-c)}
.cv__hd .rm{font-family:var(--data);font-size:11px;color:var(--label);letter-spacing:.18em;margin-left:auto}

.cv h1{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:34px;line-height:.92;margin:0 0 8px}
.cvprog{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cvprog__n{font-family:var(--data);font-size:11px;letter-spacing:.16em;color:var(--ph-b);white-space:nowrap}
.cvprog__track{flex:1;height:4px;background:#0d1116;border-radius:2px;overflow:hidden}
.cvprog__track>i{display:block;height:100%;background:var(--ph-c);transition:width .4s}
.btn--next{margin-top:4px}
.btn--next .sub{display:block;font-family:var(--body);font-weight:500;text-transform:none;
  letter-spacing:0;font-size:12px;opacity:.85;margin-top:2px}
.cv__note{font-size:14px;line-height:1.55;color:#b9c6d4;margin:0 0 22px}

.q{margin-bottom:26px}
.q__ttl{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  font-size:17px;margin:0 0 4px;display:flex;gap:9px;align-items:baseline}
.q__ttl i{font-family:var(--data);font-style:normal;font-size:11px;color:var(--ph-c);letter-spacing:.15em}
.q__sub{font-size:14px;color:var(--label);margin:0 0 12px;line-height:1.5}

.opt{
  display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;margin-bottom:8px;
  padding:14px;background:var(--deadfront);border:1px solid var(--edge);border-radius:var(--r);
  font-size:15px;line-height:1.4;color:#c9d4e0;transition:.13s}
.opt:hover{border-color:#54657a}
.opt .key{font-family:var(--data);font-size:12px;color:#5f7085;flex:none;padding-top:1px}
.opt[aria-pressed="true"]{border-color:var(--ph-c);background:#242a33;color:var(--white-wire)}
.opt[aria-pressed="true"] .key{color:var(--ph-c)}

.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{
  padding:14px 4px 11px;background:var(--deadfront);border:1px solid var(--edge);border-radius:var(--r);
  display:flex;flex-direction:column;align-items:center;gap:7px;transition:.13s}
.scale button .n{font-family:var(--data);font-size:19px;font-weight:600;color:#7f8fa3}
.scale button .t{font-size:10px;line-height:1.25;text-align:center;color:var(--label)}
.scale button[aria-pressed="true"]{border-color:var(--ph-c);background:#242a33}
.scale button[aria-pressed="true"] .n{color:var(--ph-c)}
.scale button[aria-pressed="true"] .t{color:var(--white-wire)}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:10px 13px;background:var(--deadfront);border:1px solid var(--edge);border-radius:var(--r);
  font-size:14px;color:#b9c6d4;transition:.13s}
.chip[aria-pressed="true"]{border-color:var(--ph-b);color:var(--white-wire);background:#2b2119}

textarea{width:100%;padding:12px;background:#0d1219;color:var(--white-wire);border:1px solid var(--edge);
  border-radius:var(--r);font-family:var(--body);font-size:15px;resize:vertical;min-height:78px}

.cv__submit{width:100%;padding:17px;font-size:17px;margin-top:6px}
.done-card{text-align:center;padding:28px 2px 20px}
.done-card .big{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:40px;line-height:.9;margin:14px 0 8px}
.verdict{display:inline-block;margin-bottom:14px}

/* answer recap */
.recap{text-align:left;margin:18px 0 0}
.recap__q{font-size:14px;line-height:1.5;color:#b9c6d4;background:var(--deadfront);
  border:1px solid var(--edge);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.recap__q b{display:block;font-family:var(--data);font-size:10px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--label);margin-bottom:6px;font-weight:500}
.ansrow{display:flex;gap:11px;align-items:flex-start;padding:13px 14px;border-radius:var(--r);
  border:1px solid var(--edge);background:var(--deadfront);margin-bottom:9px;font-size:15px;line-height:1.45}
.ansrow .mk{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:700;color:#fff;margin-top:1px}
.ansrow__lab{display:block;font-family:var(--data);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;margin-bottom:4px;font-weight:500}
.ansrow--right{border-color:var(--ground);background:rgba(47,185,104,.09)}
.ansrow--right .mk{background:var(--ground)}
.ansrow--right .ansrow__lab{color:var(--ground)}
.ansrow--wrong{border-color:var(--trip);background:rgba(184,32,40,.11)}
.ansrow--wrong .mk{background:var(--trip)}
.ansrow--wrong .ansrow__lab{color:#ff8f88}
.ansrow--key{border-color:var(--ph-c);background:rgba(8,112,184,.12)}
.ansrow--key .mk{background:var(--ph-c)}
.ansrow--key .ansrow__lab{color:var(--ph-b)}

.why{text-align:left;font-size:14px;line-height:1.62;color:#aebbc9;
  border-left:3px solid var(--edge);padding:2px 0 2px 14px;margin:16px 0 0}
.why b{display:block;font-family:var(--data);font-size:10px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--label);margin-bottom:6px;font-weight:500}
.why--more{border-left-color:var(--ph-c);margin-top:16px}
.why--more b{color:var(--ph-b)}
.selfnote{text-align:left;font-size:13px;line-height:1.55;color:#d8c48a;background:rgba(245,166,35,.08);
  border:1px solid rgba(245,166,35,.3);border-radius:var(--r);padding:11px 13px;margin-top:16px}
.waitcue{margin-top:22px;padding-top:18px;border-top:1px solid var(--edge);text-align:center}
.waitcue .t{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:22px;
  line-height:1;margin-bottom:7px}
.waitcue .s{font-size:14px;color:var(--label);line-height:1.5}
.waitcue .dots{display:inline-flex;gap:5px;margin-top:12px}
.waitcue .dots i{width:6px;height:6px;border-radius:50%;background:var(--ph-c);opacity:.35;
  animation:wd 1.4s ease-in-out infinite}
.waitcue .dots i:nth-child(2){animation-delay:.2s}
.waitcue .dots i:nth-child(3){animation-delay:.4s}
@keyframes wd{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(140%);
  background:var(--gutter);border:1px solid var(--edge);border-left:3px solid var(--ph-c);
  padding:12px 18px;border-radius:var(--r);font-size:14px;z-index:200;transition:transform .3s;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>

const TOOLS = [
{ id:'drw', name:'Drawings', icon:'drawings', shot:'',
  blurb:'The live sheet set. Current set, revisions, and every markup your crew makes on top of them.',
  note:'The one-line and panel schedules get revised more than anything else in the set. Confirm you’re on the current rev before you lay out.',
  q:'You marked up E-401 rev 2 with your rough-in routing. The engineer uploads rev 3. What happens to your markups?',
  opts:['They carry over onto rev 3 automatically','They are deleted when the new rev posts','They stay on rev 2 only — rev 3 comes up blank','Only the GC can move markups between revs'],
  ans:0,
  why:'Published and personal-layer markups are inherited by the new revision. Sketches are the exception — those do not carry over. So a stale markup can quietly ride along onto a sheet it no longer matches.',
  more:'Two things to watch. Published markups and your personal markup layer both carry forward, but sketches do not — those stay behind on the old revision. And a markup that carries forward is not automatically still correct: if the wall moved, your routing note is now sitting on a sheet it no longer matches. After a revision drops, open your markups and confirm they still line up before anyone works to them.' },

{ id:'spc', name:'Specifications', icon:'specs', shot:'',
  blurb:'The spec book, split into sections by division, revised and tracked the same way the drawings are.',
  note:'Division 26 carries your wire type, conduit, and labeling standard. The drawings show where it goes; the spec defines what it is.',
  q:'You are working off spec section 26 05 19. How do you know you have the current version?',
  opts:['Specs do not get revised — only drawings do','The log shows the current set by default, and All Revisions shows every version and which set it belongs to','Check the date printed on the spec book cover','Ask the GC — there is no version tracking on specs'],
  ans:1,
  why:'Specs revise exactly like drawings. Procore matches the division and section number on upload and flags the newest as current. That means an addendum can change your wire, your terminations or your labeling standard without a single new sheet ever being issued.',
  more:'Procore reads the division and section number when a spec is uploaded and files the new file as a revision of that section, flagging the newest as current. The spec log shows the current set by default; switch to All Revisions to see the full history and which set each version belongs to. This matters because addenda and bulletins frequently revise spec sections without issuing a single new drawing — so if you only watch the sheets, you can miss a change to your wire, terminations or labeling standard entirely.' },

{ id:'doc', name:'Documents', icon:'documents', shot:'',
  blurb:'The project file cabinet. Everything that is not a drawing sheet, a spec section, or a model.',
  note:'Cut sheets, approved product data, permits, the site safety plan, and closeout O&Ms all live here — everything that isn’t a drawing or a spec section.',
  q:'Sheets live in Drawings and spec sections live in Specifications. So what is Documents actually for?',
  opts:['Office use only — nothing in it concerns the field','Cut sheets, O&Ms, permits, safety plans, handouts — the material that is not a sheet or a spec section','Photos and videos','It is the same thing as Specifications under a different name'],
  ans:1,
  why:'Documents is the general file cabinet, and it is the one tool here with no workflow attached — nothing routes, nothing assigns, nobody gets notified. That is exactly why things get buried in it. Learn your job\'s folder structure now, not when the inspector is standing there asking for the approved cut sheet.',
  more:'The distinction is about workflow. Drawings and Specifications are version-controlled sets. Submittals, RFIs, Observations and Punch all carry ball-in-court — somebody owes somebody a response. Documents has none of that: nothing routes, nothing notifies, nobody is assigned. It is storage, which is exactly why things get buried in it. Folder permissions also vary, so a folder existing does not mean you can see it. Learn your job structure early, and if you cannot find the approved cut sheet, ask for access rather than assuming it was never uploaded.' },

{ id:'mdl', name:'Models', icon:'models', shot:'',
  blurb:'The coordinated 3D model on your phone, in the field. Walk it, measure it, and raise what is wrong from where you are standing.',
  note:'The coordinated model shows your routing against every other trade. Check it during layout, before the tray and trapeze are hung.',
  q:'You are on level 3 and installed duct is sitting in your coordinated tray corridor. What can you do right there from the Models tool?',
  opts:['Nothing — models are view only on mobile','Capture the view and raise an observation or coordination issue from that spot, assigned to whoever owns the fix','Move the duct in the model yourself','Measure only — issues have to be opened from a desktop'],
  ans:1,
  why:'You can navigate, measure against installed work, and open the issue with the model view attached — which is what makes it stick when the other trade argues. What you cannot do is change the model. That goes back to the BIM team, and from there it can be elevated to an RFI.',
  more:'You can navigate the federated model, measure against what is actually installed, and open an observation or coordination issue from the exact spot you are standing, with the model view attached — that attachment is what makes it stick when another trade disputes it. What you cannot do is change the model itself. Model changes go back to the BIM/VDC team. If the clash turns out to be a design conflict rather than an install error, it gets elevated to an RFI so there is a formal answer on record.' },

{ id:'rfi', name:'RFIs', icon:'rfi', shot:'',
  blurb:'The formal question. Who has the ball, what the official response was, and the date stamp that backs up your change order.',
  note:'A conflict like a 42-circuit schedule against a 30-space tub is an RFI. A verbal answer in the field won’t support a change order later.',
  q:'You have Standard permission on RFIs. You create one. What happens next?',
  opts:['It goes straight to the architect','It saves as a Draft and goes to the RFI Manager to review, open and assign','It auto-opens and starts a 5-day response clock','Nothing until you email a PDF to the GC'],
  ans:1,
  why:'Standard-level users create the RFI in Draft and route it to the RFI Manager, who opens it and picks the assignees. It also means an RFI you thought you sent can be sitting in Draft doing nothing for you. Check the status, not just that you typed it.',
  more:'Permission level decides the path. Standard users create an RFI in Draft, and it goes to the RFI Manager, who reviews it, opens it and assigns the responders — the response clock does not start until they open it. Admin users can create and open directly. The practical trap is the draft that never got opened: you typed the question, you assume it is out, and weeks later nothing has moved. Check the status field, not just that you wrote it. Note too that the Official Response is its own field — a helpful comment in the thread is not the contractual answer.' },

/* ================================================================
   RELAY — how phones reach the presenter screen.
   ================================================================ */
const Relay = (() => {
  let mode='mqtt', room='', onMsg=()=>{}, onLink=()=>{};
  let client=null, fbUrl='', pollTimer=null, seen=new Set(), outbox=[];
  const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];
  const CDN=n=>[`https://cdnjs.cloudflare.com/ajax/libs/${n}`,`https://cdn.jsdelivr.net/npm/${n}`,`https://unpkg.com/${n}`];

  function loadScript(urls){
    return new Promise((res,rej)=>{
      let i=0;
      const tryNext=()=>{
        if(i>=urls.length) return rej(new Error('all CDNs failed'));
        const s=document.createElement('script');
        s.src=urls[i++]; s.onload=()=>res(); s.onerror=tryNext;
        document.head.appendChild(s);
      };
      tryNext();
    });
  }

  async function connectMqtt(bi){
    bi=bi||0;
    if(!window.mqtt){
      try{ await loadScript(CDN('mqtt/4.3.7/mqtt.min.js').concat(['https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js'])); }
      catch(e){ onLink(false,'Could not load the messaging library. Check the network.'); return; }
    }
    if(bi>=BROKERS.length){ onLink(false,'No broker reachable. Try the Firebase option in Setup.'); return; }
    const host=BROKERS[bi].split('//')[1].split(':')[0];
    try{
      client=window.mqtt.connect(BROKERS[bi],{clientId:'pc_'+Math.random().toString(16).slice(2,10),
        connectTimeout:6500,reconnectPeriod:5000,clean:true});
    }catch(e){ return connectMqtt(bi+1); }

    let up=false;
    const giveUp=()=>{ if(up) return; up=true; try{client.end(true)}catch(e){} client=null; connectMqtt(bi+1); };
    const probe=setTimeout(giveUp,7500);

    client.on('error',()=>{ if(!up) giveUp(); });
    client.on('offline',()=>{ if(up) onLink(false,'reconnecting'); });
    client.on('reconnect',()=>{ if(up) onLink(false,'reconnecting'); });
    client.on('connect',()=>{
      up=true; clearTimeout(probe); onLink(true,host);
      client.subscribe('pcheck/'+room+'/resp',{qos:1});
      outbox.splice(0).forEach(p=>client.publish('pcheck/'+room+'/resp',JSON.stringify(p),{qos:1}));
    });
    client.on('message',(t,p)=>{ try{ onMsg(JSON.parse(p.toString())); }catch(e){} });
  }

  function fbPath(){ return fbUrl.replace(/\/$/,'')+'/pcheck/'+room+'.json'; }
  async function fbPoll(){
    try{
      const res=await fetch(fbPath()+'?_='+Date.now());
      if(!res.ok) throw new Error(res.status);
      const data=await res.json();
      onLink(true,'firebase');
      if(data) Object.values(data).forEach(r=>{ const k=r.pid+'|'+r.tool; if(!seen.has(k+'|'+r.ts)){ seen.add(k+'|'+r.ts); onMsg(r);} });
    }catch(e){ onLink(false,'Firebase unreachable'); }
  }

  return {
    init(opts){
      mode=opts.mode||'mqtt'; room=opts.room; onMsg=opts.onMessage||onMsg; onLink=opts.onLink||onLink;
      fbUrl=opts.fbUrl||'';
      if(mode==='demo'){ onLink(true,'demo'); return; }
      if(mode==='firebase'&&fbUrl){ fbPoll(); pollTimer=setInterval(fbPoll,2000); return; }
      connectMqtt(0);
    },
    async send(payload){
      if(mode==='demo'){ onMsg(payload); return true; }
      if(mode==='firebase'&&fbUrl){
        try{ const r=await fetch(fbUrl.replace(/\/$/,'')+'/pcheck/'+room+'/'+payload.pid+'_'+payload.tool+'.json',
              {method:'PUT',body:JSON.stringify(payload)}); return r.ok; }
        catch(e){ return false; }
      }
      if(client&&client.connected){ client.publish('pcheck/'+room+'/resp',JSON.stringify(payload),{qos:1}); return true; }
      outbox.push(payload); return 'queued';
    },
    stop(){ if(client) try{client.end(true)}catch(e){} if(pollTimer) clearInterval(pollTimer); }
  };
})();

function qrInto(node,text,size){
  // Uses the embedded qrcode-generator (no network). Renders crisp SVG.
  node.innerHTML='';
  try{
    const qr=qrcode(0,'M');          // type 0 = auto-size, error-correction M
    qr.addData(text); qr.make();
    const n=qr.getModuleCount(), quiet=4, dim=n+quiet*2;
    let cells='';
    for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(qr.isDark(r,c))
      cells+='<rect x="'+(c+quiet)+'" y="'+(r+quiet)+'" width="1.03" height="1.03"/>';
    node.innerHTML='<svg viewBox="0 0 '+dim+' '+dim+'" shape-rendering="crispEdges" '+
      'style="width:'+(size||200)+'px;height:'+(size||200)+'px;display:block">'+
      '<rect width="'+dim+'" height="'+dim+'" fill="#fff"/><g fill="#0e0f12">'+cells+'</g></svg>';
  }catch(e){
    node.innerHTML='<div style="padding:16px;color:#0e0f12;font-family:var(--data);font-size:11px;max-width:220px;word-break:break-all">Type this in:<br><br><b>'+esc(text)+'</b></div>';
  }
}

/* soft click / zap using WebAudio — off by default */
let audioOn=false, actx=null;
function zap(kind){
  if(!audioOn) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=kind==='trip'?'sawtooth':'triangle';
    o.frequency.setValueAtTime(kind==='trip'?110:660,actx.currentTime);
    o.frequency.exponentialRampToValueAtTime(kind==='trip'?55:1320,actx.currentTime+.12);
    g.gain.setValueAtTime(.08,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.22);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+.24);
  }catch(e){}
}

function renderPresenter(){
  const cfg=store.get('pc:setup',null);
  if(!cfg||!cfg.tools||!cfg.tools.length){ location.hash=''; return renderHome(); }
  const room=cfg.room, list=cfg.tools.map(byId).filter(Boolean);
  const KEY='pc:data:'+room;

  const saved=store.get(KEY,[]);
  const state={ idx:0, responses:saved, people:new Set(saved.map(r=>r.pid)), seats:[] };
  // stable seat order — a person keeps the same seat across every tool
  saved.forEach(r=>{ if(!state.seats.includes(r.pid)) state.seats.push(r.pid); });
  const crewN=()=>Math.max(cfg.crew||12, state.seats.length);

  // Keep the scan URL as short as possible — fewer QR modules scan far better
  // from across a training room. The tool list is only needed when the presenter
  // picked a subset; the phone defaults to the full list otherwise.
  const allSelected = cfg.tools.length===TOOLS.length;
  let baseScan=baseUrl()+'#c='+room+(allSelected?'':'&t='+cfg.tools.join(','));
  if(cfg.mode==='firebase'&&cfg.fbUrl) baseScan+='&m=firebase&f='+encodeURIComponent(cfg.fbUrl);
  const toolUrl=id=>baseScan+'&go='+id;

  const CONF_COLOR=['#b82028','#f5a623','#0870b8','#4aa3d8','#2fb968']; // conf 1..5

  const app=$('#app'); app.className='';
  app.innerHTML=`
  <div class="pv">
    <div class="pv__top">
      <span class="brandmark brandmark--top" role="img" aria-label="Arden Engineering Constructors"></span>
      <div class="pv__id">Panel<span>Check</span></div>
      <div class="pv__room">PROCORE FOREMAN CHECK · ${esc(room)}</div>
      <div class="pv__spacer"></div>
      <div class="pv__stat"><span class="link-led" id="led"></span><span id="linkTxt">connecting</span></div>
      <div class="pv__stat">In room <b id="nPeople">0</b></div>
      <div class="pv__stat">Answers <b id="nResp">0</b></div>

    <div class="pv__body">

        <div class="pv__tool"><span id="toolIcon"></span><h2 id="toolName"></h2></div>
        <p class="pv__blurb" id="toolBlurb"></p>
        <div class="fieldnote"><span class="eyebrow">From the field</span><p id="toolNote"></p></div>
        <div class="shot" id="shot"></div>
        <div class="qrwarn hide" id="qrWarn"></div>
        <div class="qrblock">
          <div class="qrframe" id="qr"></div>
          <div class="qrblock__txt">
            <div class="pv__scanmsg">Scan to answer<br><em id="qrTool"></em></div>
            <div class="pv__scanhint">Opens straight to this tool. No code, no app.</div>
            <div class="pv__url" id="qrUrl"></div>

        </div>
      </div>

      <div class="dash">
        <div class="dash__cards">
          <div class="statcard statcard--ans">
            <div class="lab">Answered this tool</div>
            <div class="statcard__spark" id="ansSpark">+1</div>
            <div class="big"><span id="ansNow">0</span><small> / <span id="ansOf">0</span></small></div>
          </div>
          <div class="statcard">
            <div class="lab">Got it right</div>
            <div class="dial" style="margin-top:8px">
              <svg viewBox="0 0 80 80"><circle class="dial__ring" cx="40" cy="40" r="32"/>
                <circle class="dial__val" id="scoreArc" cx="40" cy="40" r="32" stroke="var(--ground)" stroke-dasharray="0 201"/></svg>
              <div><div class="dial__pct" id="scorePct">—</div><div class="dial__cap">of answers<br>correct</div></div>
            </div>
          </div>
          <div class="statcard">
            <div class="lab">Confidence</div>
            <div class="gauge" style="margin-top:8px">
              <svg viewBox="0 0 96 58">
                <path d="M8 50 A40 40 0 0 1 88 50" fill="none" stroke="#0d1116" stroke-width="7"/>
                <path d="M8 50 A40 40 0 0 1 88 50" fill="none" stroke="url(#gg)" stroke-width="7" stroke-linecap="round" opacity=".9"/>
                <defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0" stop-color="#b82028"/><stop offset=".5" stop-color="#0870b8"/><stop offset="1" stop-color="#2fb968"/></linearGradient></defs>
                <g class="gauge__needle" id="confNeedle"><line x1="48" y1="50" x2="48" y2="18" stroke="var(--white-wire)" stroke-width="2.4" stroke-linecap="round"/></g>
                <circle cx="48" cy="50" r="3.2" fill="var(--white-wire)"/>
              </svg>
              <div><div class="gauge__read" id="confRead">—</div><div class="gauge__cap">avg of 5</div></div>
            </div>
          </div>
        </div>

        <div class="seatpanel">
          <div class="seatpanel__hd">
            <span class="t">The room</span>
            <span class="lg"><span><i style="background:var(--ground)"></i>correct</span><span><i style="background:var(--trip)"></i>missed</span><span><i style="background:#0d1116;border:1px solid #262d36"></i>waiting</span></span>
            <span class="c" id="seatCount">0 / 0 answered</span>
          </div>
          <div class="seatgrid" id="seatgrid"></div>
        </div>

        <div class="histo">
          <div class="histo__hd"><span class="t">How well they say they know it</span><span class="s" id="histoNote">1 = never opened it · 5 = I train my crew</span></div>
          <div class="histo__bars" id="histoBars"></div>

    <div class="pv__bus">
      <div class="busbar" id="busbar"></div>
      <div class="breakers" id="breakers"></div>
