  </div>

  <div class="ctlbar">
    <button class="btn btn--sm" id="bPrev">&larr; Prev</button>
    <button class="btn btn--sm" id="bNext">Next &rarr;</button>
    <button class="btn btn--sm" id="bSum">Summary</button>
    <button class="btn btn--sm" id="bSound">Sound: off</button>
    <button class="btn btn--sm" id="bExport">Export</button>
    <button class="btn btn--sm btn--ghost" id="bReset">Reset</button>
    <button class="btn btn--sm btn--ghost" id="bHome">Setup</button>
  </div>`;

  /* breakers (cross-tool overview) */
  const brkRow=$('#breakers'); const brkEls={};
  list.forEach((t,i)=>{
    const b=el('button','brk',`
      <div class="brk__hd">${I[t.icon]}<span class="brk__name">${esc(t.name)}</span></div>
      <div class="brk__gauge">${gaugeSvg(0)}<span class="brk__n">0</span></div>
      <div class="brk__bar"><i></i></div>
      <div class="brk__flash"></div>`);
    b.type='button'; b.dataset.state='idle'; b.onclick=()=>{ state.idx=i; paint(true); };
    brkRow.appendChild(b); brkEls[t.id]=b;
  });
  function gaugeSvg(v){
    const a=(-160+v*140)*Math.PI/180, cx=17,cy=17,r=12;
    return `<svg viewBox="0 0 34 20"><path d="M4 17 A13 13 0 0 1 30 17" fill="none" stroke="#0d1116" stroke-width="3"/>
      <path d="M4 17 A13 13 0 0 1 30 17" fill="none" stroke="var(--ph-c)" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="${(v*40.8).toFixed(1)} 99" opacity=".9"/>
      <line x1="${cx}" y1="${cy}" x2="${(cx+Math.cos(a)*r).toFixed(1)}" y2="${(cy+Math.sin(a)*r).toFixed(1)}" stroke="#e8edf3" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="${cx}" cy="${cy}" r="1.8" fill="#e8edf3"/></svg>`;
  }

  /* histogram scaffold */
  const histoBars=$('#histoBars'); const hcols=[];
  CONF.forEach(c=>{
    const col=el('div','hcol',`<div class="n">0</div><div class="track"><div class="fill" style="background:${CONF_COLOR[c.n-1]}"></div></div><div class="cap">${c.n}<br>${esc(c.t)}</div>`);
    histoBars.appendChild(col); hcols.push(col);
  });

  /* seat grid */
  const seatgrid=$('#seatgrid'); let seatEls=[], builtN=0;
  function buildSeats(){
    const N=crewN(); if(N===builtN) return; builtN=N;
    seatgrid.innerHTML=''; seatEls=[];
    const cols=Math.min(N, Math.ceil(Math.sqrt(N*2.2)));
    seatgrid.style.gridTemplateColumns=`repeat(${cols},1fr)`;
    for(let i=0;i<N;i++){ const s=el('div','seat'); s.dataset.s='wait'; seatgrid.appendChild(s); seatEls.push(s); }
  }
  function seatIndex(pid){ let i=state.seats.indexOf(pid); if(i<0){ i=state.seats.length; state.seats.push(pid); } return i; }

  /* ---- stats ---- */
  const forTool=id=>state.responses.filter(r=>r.tool===id);
  function toolStats(id){
    const rs=forTool(id); if(!rs.length) return null;
    return {n:rs.length, conf:rs.reduce((a,r)=>a+r.conf,0)/rs.length,
      score:rs.filter(r=>r.correct).length/rs.length, rs};
  }
  function verdict(s){ if(!s) return 'idle';
    if(s.score<.6||s.conf<2.6) return 'trip';
    if(s.score<.85||s.conf<3.5) return 'live'; return 'ok'; }

  const C=201.06; // 2*pi*32

  function paint(toolChanged){
    const t=list[state.idx];
    buildSeats();

    if(toolChanged){
      $('#cktNo').textContent='TOOL '+String(state.idx+1).padStart(2,'0');
      $('#cktOf').textContent='OF '+String(list.length).padStart(2,'0');
      $('#toolIcon').innerHTML=I[t.icon];
      $('#toolName').textContent=t.name;
      $('#toolBlurb').textContent=t.blurb;
      $('#toolNote').textContent=t.note;
      $('#qrTool').textContent=t.name;
      $('#qrUrl').textContent=toolUrl(t.id).replace(/^https?:\/\//,'');
      qrInto($('#qr'),toolUrl(t.id),206);
      // A QR pointing at file:/// or localhost cannot be opened by a phone —
      // this is the usual cause of "no data found" when previewing locally.
      const warn=$('#qrWarn'), u=toolUrl(t.id);
      const bad=!/^https?:\/\//i.test(u) || /^https?:\/\/(localhost|127\.|0\.0\.0\.0|\[::1\])/i.test(u);
      warn.classList.toggle('hide',!bad);
      if(bad) warn.innerHTML='<b>Phones can&rsquo;t open this link</b>'+
        'This page is running locally, so the QR points at '+esc(u.split('#')[0])+
        ' &mdash; which only exists on this computer. Publish it to GitHub Pages, or go back to Setup and paste the published URL.';
      const shot=$('#shot'); shot.innerHTML=''; shot.classList.remove('has');
      if(t.shot){
        const im=new Image(); im.alt=t.name+' in Procore'; im.src=t.shot; shot.classList.add('has');
        im.onerror=()=>{ shot.classList.remove('has'); };
        shot.appendChild(im);
      }
    }

    $('#nResp').textContent=state.responses.length;
    $('#nPeople').textContent=Math.max(state.people.size,0);

    const s=toolStats(t.id), N=crewN();
    const answered=s?s.n:0;
    $('#ansNow').textContent=answered;
    $('#ansOf').textContent=N;
    $('#seatCount').textContent=answered+' / '+N+' answered';

    // score dial
    const scoreArc=$('#scoreArc');
    scoreArc.setAttribute('stroke-dasharray', (s?s.score*C:0).toFixed(1)+' '+C);
    scoreArc.setAttribute('stroke', !s?'var(--edge)': s.score<.6?'var(--trip)': s.score<.85?'var(--ph-c)':'var(--ground)');
    $('#scorePct').textContent=s?Math.round(s.score*100)+'%':'—';

    // confidence gauge
    const conf=s?s.conf:0;
    $('#confNeedle').style.transform='rotate('+(-80+(Math.max(1,conf)-1)/4*160)+'deg)';
    $('#confRead').textContent=s?conf.toFixed(1):'—';

    // histogram
    const counts=[0,0,0,0,0]; if(s) s.rs.forEach(r=>counts[Math.min(4,Math.max(0,r.conf-1))]++);
    const max=Math.max(1,...counts);
    hcols.forEach((col,i)=>{ $('.fill',col).style.height=(counts[i]/max*100)+'%'; $('.n',col).textContent=counts[i]; });

    // seat states for this tool
    const answeredBy={}; if(s) s.rs.forEach(r=>answeredBy[r.pid]=r);
    seatEls.forEach((se,i)=>{ const pid=state.seats[i];
      const r=pid?answeredBy[pid]:null;
      se.dataset.s = r ? (r.correct?'right':'wrong') : 'wait';
    });

    // breaker overview
    list.forEach((x,i)=>{ const b=brkEls[x.id], st=toolStats(x.id), v=verdict(st);
      b.dataset.state=v; b.classList.toggle('is-current',i===state.idx);
      $('.brk__gauge',b).innerHTML=gaugeSvg(st?(st.conf-1)/4:0)+'<span class="brk__n">'+(st?st.n:0)+'</span>';
      $('.brk__bar i',b).style.width=(st?st.score*100:0)+'%';
    });

    const done=list.filter(x=>forTool(x.id).length).length;
    $('#bSum').textContent = done===list.length ? 'Summary ✓' : 'Summary';
  }

  /* ---- animation on a live answer ---- */
  const reduce=()=>window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  function celebrate(r){
    const t=list[state.idx];
    if(r.tool!==t.id){ // answer for a different tool: just nudge its breaker
      pulseBreaker(r.tool,r.name); return;
    }
    buildSeats();
    const si=seatIndex(r.pid);
    if(si>=builtN){ builtN=0; buildSeats(); }
    const seat=seatEls[si];
    if(seat){ seat.dataset.s=r.correct?'right':'wrong'; if(!reduce()){ seat.classList.remove('pop'); void seat.offsetWidth; seat.classList.add('pop'); } }
    // bump histogram column
    const col=hcols[Math.min(4,Math.max(0,r.conf-1))];
    if(col&&!reduce()){ col.classList.remove('bump'); void col.offsetWidth; col.classList.add('bump'); }
    // answered spark on the stat card
    const sp=$('#ansSpark'); if(sp&&!reduce()){ sp.classList.remove('live'); void sp.offsetWidth; sp.classList.add('live'); }
    // spark from the seat down into the breaker
    sparkFromSeat(seat,r.tool,r.name);
    zap(r.correct?'hit':'trip');
  }
  function pulseBreaker(toolId,name){
    const target=brkEls[toolId]; if(!target||reduce()) return;
    $('.brk__flash',target).animate([{opacity:.5},{opacity:0}],{duration:420,easing:'ease-out'});
    target.animate([{transform:'translateY(0)'},{transform:'translateY(-4px)'},{transform:'translateY(0)'}],{duration:260});
  }
  function sparkFromSeat(seat,toolId,name){
    const target=brkEls[toolId]; if(!target) return;
    if(reduce()){ pulseBreaker(toolId); return; }
    const from=(seat||$('#qr')).getBoundingClientRect();
    const tr=target.getBoundingClientRect();
    const x0=from.left+from.width/2, y0=from.top+from.height/2;
    const x1=tr.left+tr.width/2, y1=tr.top+14;
    const s=el('div','spark'); s.style.left=x0+'px'; s.style.top=y0+'px'; document.body.appendChild(s);
    s.animate([{transform:'translate(0,0) scale(1)',opacity:1},
               {transform:`translate(${x1-x0}px,${y1-y0}px) scale(.5)`,opacity:.25}],
              {duration:520,easing:'cubic-bezier(.3,.05,.2,1)'}).onfinish=()=>{ s.remove(); pulseBreaker(toolId); };
    if(name){ const p=el('div','namepop',esc(name)); p.style.left=(x1-24)+'px'; p.style.top=(tr.top-6)+'px'; document.body.appendChild(p);
      p.animate([{transform:'translateY(6px)',opacity:0},{transform:'translateY(-14px)',opacity:1,offset:.25},{transform:'translateY(-34px)',opacity:0}],
        {duration:1400,easing:'ease-out'}).onfinish=()=>p.remove(); }
  }

  /* ---- incoming ---- */
  function ingest(r,animate){
    if(!r||!r.tool||!byId(r.tool)) return;
    const i=state.responses.findIndex(x=>x.pid===r.pid&&x.tool===r.tool);
    if(i>=0){ if(state.responses[i].ts>=r.ts) return; state.responses[i]=r; }
    else state.responses.push(r);
    state.people.add(r.pid);
    if(!state.seats.includes(r.pid)) state.seats.push(r.pid);
    store.set(KEY,state.responses);
    if(animate!==false) celebrate(r);
    paint(false);
  }

  Relay.init({
    mode:cfg.mode, room, fbUrl:cfg.fbUrl,
    onMessage:r=>ingest(r,true),
    onLink:(ok,info)=>{ $('#led').classList.toggle('on',!!ok); $('#linkTxt').textContent=ok?(info||'linked'):(info||'no link'); }
  });

  /* ---- controls ---- */
  const go=d=>{ state.idx=(state.idx+d+list.length)%list.length; paint(true); };
  $('#bPrev').onclick=()=>go(-1); $('#bNext').onclick=()=>go(1);
  $('#bSum').onclick=()=>showSummary(list,state.responses,room);
  $('#bHome').onclick=()=>{ Relay.stop(); location.hash=''; location.reload(); };
  $('#bSound').onclick=e=>{ audioOn=!audioOn; e.target.textContent='Sound: '+(audioOn?'on':'off'); if(audioOn) zap('hit'); };
  $('#bExport').onclick=()=>exportCsv(list,state.responses,room);
  $('#bReset').onclick=()=>{ if(!confirm('Clear every answer for session '+room+'?')) return;
    state.responses=[]; state.people.clear(); state.seats=[]; builtN=0; store.set(KEY,[]); paint(true); toast('Session cleared.'); };

  document.addEventListener('keydown',e=>{
    if(e.target.matches('input,textarea')) return;
    if(e.key==='ArrowRight'||e.key==='PageDown'){ e.preventDefault(); go(1); }
    if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); go(-1); }
    if(e.key==='s'||e.key==='S') $('#bSum').click();
    if(e.key==='f'||e.key==='F'){ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); }
    if(e.key==='Escape'&&$('.sum')) $('.sum').remove();
  });

  paint(true);
  if(state.responses.length) toast('Restored '+state.responses.length+' answers from this session.');

  /* demo mode: simulate a crew answering the tool that's on screen */
  if(cfg.mode==='demo'){
    const names=['Ruiz','Kowalski','Burke','Sam O.','Tavares','Nguyen','Mike C.','Corrigan','Petrov','Ana R.','Delgado','Shea','Okafor','Reyes','Sokolov','Jimmy T.'];
    let k=0;
    setInterval(()=>{
      const t=list[state.idx];                       // answer the current tool, so the graphics move
      const pid='demo'+(k%crewN());
      const already=state.responses.some(x=>x.pid===pid&&x.tool===t.id);
      k++;
      if(already) return;
      const strong=Math.random()>((t.id==='sub'||t.id==='spc'||t.id==='mdl')?.62:.34);
      ingest({pid,name:names[(+pid.slice(4))%names.length],tool:t.id,
        conf:strong?4+Math.round(Math.random()):1+Math.round(Math.random()*2),
        correct:strong?Math.random()>.15:Math.random()>.68,
        friction:[FRICTION[Math.floor(Math.random()*FRICTION.length)]],
        note:Math.random()>.86?'Never got shown this one on my last job.':'',
        ts:Date.now()},true);
    },900);
  }
}

/* ================================================================
   SUMMARY — the panel schedule
   ================================================================ */
function summaryModel(list,responses){
  const rows=list.map((t,i)=>{
    const rs=responses.filter(r=>r.tool===t.id);
    const n=rs.length;
    const conf=n?rs.reduce((a,r)=>a+r.conf,0)/n:0;
    const confN=n?(conf-1)/4:0;
    const nRight=rs.filter(r=>r.correct).length;
    const score=n?nRight/n:0;
    // people who rated themselves 4+ and still missed it
    const blind=rs.filter(r=>r.conf>=4&&!r.correct).length;
    // the wrong option the most people landed on
    const wrongCount={};
    rs.filter(r=>!r.correct&&r.ans!=null&&r.ans>=0&&r.ans!==t.ans&&t.opts[r.ans]!=null)
      .forEach(r=>{wrongCount[r.ans]=(wrongCount[r.ans]||0)+1;});
    let topWrong=null,topWrongN=0;
    Object.keys(wrongCount).forEach(k=>{ if(wrongCount[k]>topWrongN){topWrongN=wrongCount[k];topWrong=+k;} });
    const gap=n?confN-score:0;          // >0 means the room is overconfident here
    const need=n?((1-score)*0.55+(1-confN)*0.22+Math.max(0,gap)*0.23):-1;
    return {t,i,n,conf,confN,score,nRight,blind,gap,need,topWrong,topWrongN,rs};
  });

  rows.forEach(r=>{
    if(!r.n){ r.tier=0; r.tag='tag--none'; r.tagTxt='No data'; r.action='Nobody answered this one — cover it or drop it from the next session.'; return; }
    const blindRate=r.blind/r.n;
    if(r.score<0.6||blindRate>=0.34){ r.tier=1; r.tag='tag--trip'; r.tagTxt='Train first'; }
    else if(r.score<0.85||r.conf<3.5){ r.tier=2; r.tag='tag--watch'; r.tagTxt='Refresh'; }
    else { r.tier=3; r.tag='tag--ok'; r.tagTxt='Holding'; }

    if(r.gap>0.2&&r.score<0.8)
      r.action='They believe they know this and they don\u2019t. Lead with the wrong answer below and show why it fails before you show the tool.';
    else if(r.score<0.5)
      r.action='Most of the room missed it. Walk the tool live on a real job and let them do it once with you watching.';
    else if(r.score<0.85)
      r.action='The concept mostly landed but the specific rule did not. A five-minute refresher on that one point should close it.';
    else if(r.confN<0.5)
      r.action='They get it right but do not trust themselves. Give them reps, and check nobody is blocked by permissions.';
    else
      r.action='Solid across the room. No action needed beyond keeping it in the onboarding for new foremen.';
  });

  return rows;
}

function showSummary(list,responses,room){
  const old=$('.sum'); if(old) old.remove();
  const rows=summaryModel(list,responses);
  const withData=rows.filter(r=>r.n);
  const people=new Set(responses.map(r=>r.pid));
  const nPeople=people.size;

  // headline numbers
  const totalAns=responses.length;
  const totalRight=responses.filter(r=>r.correct).length;
  const overall=totalAns?totalRight/totalAns:0;
  const avgConf=totalAns?responses.reduce((a,r)=>a+r.conf,0)/totalAns:0;
  const blindTotal=responses.filter(r=>r.conf>=4&&!r.correct).length;
  const covered=withData.length;
  const trainFirst=rows.filter(r=>r.tier===1).length;

  // how the room splits: each person's own correct rate
  const perPerson=[];
  people.forEach(pid=>{
    const mine=responses.filter(r=>r.pid===pid);
    perPerson.push({pid,n:mine.length,right:mine.filter(r=>r.correct).length,
      pct:mine.length?mine.filter(r=>r.correct).length/mine.length:0,
      name:(mine[0]&&mine[0].name)||''});
  });
  const buckets=[
    {lab:'0\u201349%',  test:p=>p.pct<0.5,               col:'var(--trip)'},
    {lab:'50\u201369%', test:p=>p.pct>=0.5&&p.pct<0.7,   col:'var(--warn)'},
    {lab:'70\u201389%', test:p=>p.pct>=0.7&&p.pct<0.9,   col:'var(--ph-c)'},
    {lab:'90\u2013100%',test:p=>p.pct>=0.9,              col:'var(--ground)'}
  ].map(b=>({...b,n:perPerson.filter(b.test).length}));
  const bMax=Math.max(1,...buckets.map(b=>b.n));

  // friction + comments
  const fri={}; responses.forEach(r=>(r.friction||[]).forEach(f=>fri[f]=(fri[f]||0)+1));
  const friList=Object.keys(fri).map(k=>[k,fri[k]]).sort((a,b)=>b[1]-a[1]);
  const friMax=friList.length?friList[0][1]:1;
  const notes=responses.filter(r=>r.note&&r.note.trim()).slice(-9).reverse();

  const ranked=[...withData].sort((a,b)=>b.need-a.need);
  const blindRows=withData.filter(r=>r.blind>0).sort((a,b)=>(b.blind/b.n)-(a.blind/a.n));

  // one-line read on the room
  let verdict;
  if(!totalAns) verdict='No answers recorded yet.';
  else if(overall>=0.85&&blindTotal<=1) verdict='Strong across the board. Keep this set for onboarding new foremen rather than retraining this crew.';
  else if(trainFirst>=Math.ceil(covered/2)) verdict='Broad gaps rather than isolated ones \u2014 worth scheduling a full session rather than picking off single tools.';
  else if(blindTotal>=Math.max(3,totalAns*0.2)) verdict='The issue is calibration more than knowledge: people are confident on tools they are getting wrong. Start there.';
  else verdict='Mostly solid with a few specific gaps. The top of the plan below is a short, targeted session.';

  const s=el('div','sum');
  s.innerHTML=`
    <div class="sum__hd">
      <span class="brandmark brandmark--sum" role="img" aria-label="Arden Engineering Constructors"></span>
      <div>
        <span class="eyebrow">Procore foreman check &middot; session ${esc(room)} &middot; ${new Date().toLocaleDateString()}</span>
        <h2>Training summary</h2>
      </div>
      <div class="sum__acts">
        <button class="btn btn--sm" id="sumCopy">Copy plan</button>
        <button class="btn btn--sm" id="sumCsv">Export CSV</button>
        <button class="btn btn--sm" id="sumPrint">Print / PDF</button>
        <button class="btn btn--sm btn--go" id="sumClose">Back to session</button>
      </div>
    </div>

    <div class="kpis">
      <div class="kpi"><span class="lab">In the room</span><span class="v">${nPeople}</span>
        <span class="sub">${totalAns} answer${totalAns===1?'':'s'} across ${covered} tool${covered===1?'':'s'}</span></div>
      <div class="kpi ${overall>=0.85?'kpi--good':overall<0.6?'kpi--alert':''}"><span class="lab">Answered correctly</span>
        <span class="v">${totalAns?Math.round(overall*100)+'%':'\u2014'}</span>
        <span class="sub">${totalRight} of ${totalAns}</span></div>
      <div class="kpi"><span class="lab">Avg confidence</span>
        <span class="v">${totalAns?avgConf.toFixed(1):'\u2014'}<small> / 5</small></span>
        <span class="sub">how well they say they know these tools</span></div>
      <div class="kpi ${blindTotal?'kpi--alert':'kpi--good'}"><span class="lab">Blind spots</span>
        <span class="v">${blindTotal}</span>
        <span class="sub">rated themselves 4+ and still got it wrong</span></div>
      <div class="kpi ${trainFirst?'kpi--alert':'kpi--good'}"><span class="lab">Train first</span>
        <span class="v">${trainFirst}</span>
        <span class="sub">tool${trainFirst===1?'':'s'} needing real time, not a refresher</span></div>
    </div>

    <div class="sec">
      <div class="sec__hd"><h3>Where to start</h3><span class="s">${esc(verdict)}</span></div>
      <div class="plan">
        ${ranked.length?ranked.map((r,i)=>`
          <div class="pcard pcard--p${r.tier}">
            <div class="pcard__top">
              <span class="pcard__rank">${String(i+1).padStart(2,'0')}</span>
              <span class="pcard__nm">${esc(r.t.name)}</span>
              <span class="pcard__tag tag ${r.tag}">${r.tagTxt}</span>
            </div>
            <div class="pcard__nums">
              <span>correct <b>${Math.round(r.score*100)}%</b></span>
              <span>confidence <b>${r.conf.toFixed(1)}</b></span>
              <span>answered <b>${r.n}</b></span>
              ${r.blind?`<span>blind spots <b style="color:#ff8f88">${r.blind}</b></span>`:''}
            </div>
            <div class="pcard__act">${esc(r.action)}</div>
            ${r.topWrong!=null?`<div class="pcard__miss"><b>Most common wrong answer &mdash; ${r.topWrongN} of ${r.n}</b>${esc(r.t.opts[r.topWrong])}<br><i>Correct: ${esc(r.t.opts[r.t.ans])}</i></div>`:''}
          </div>`).join(''):'<p class="emptyline">No answers recorded yet.</p>'}
      </div>
    </div>

    <div class="sec sec__split">
      <div>
        <div class="sec__hd"><h3>Every tool</h3><span class="s">Confidence is what they claim. Correct is what they showed.</span></div>
        <table class="sched">
          <thead><tr><th>#</th><th>Tool</th><th>Answers</th><th>Confidence</th><th>Correct</th><th>Status</th></tr></thead>
          <tbody>${rows.map(r=>`
            <tr>
              <td class="sched__ckt">${String(r.i+1).padStart(2,'0')}</td>
              <td><div class="sched__nm">${esc(r.t.name)}</div></td>
              <td class="sched__ckt">${r.n||'\u2014'}</td>
              <td><div class="pillbar"><span class="track"><i style="width:${(r.confN*100).toFixed(0)}%;background:var(--ph-c)"></i></span><span class="val">${r.n?r.conf.toFixed(1):'\u2014'}</span></div></td>
              <td><div class="pillbar"><span class="track"><i style="width:${(r.score*100).toFixed(0)}%;background:${r.score<0.6?'var(--trip)':r.score<0.85?'var(--warn)':'var(--ground)'}"></i></span><span class="val">${r.n?Math.round(r.score*100)+'%':'\u2014'}</span></div></td>
              <td><span class="tag ${r.tag}">${r.tagTxt}</span></td>
            </tr>`).join('')}</tbody>
        </table>
      </div>

      <div>
        <div class="panel">
          <h4>Blind spots</h4>
          <p class="sub">People who rated themselves 4 or 5 and still answered wrong. They will not ask for help on these, and they are the ones training apprentices.</p>
          ${blindRows.length?blindRows.map(r=>`
            <div class="blind">
              <span class="blind__n">${r.blind}</span>
              <span><span class="blind__nm">${esc(r.t.name)}</span><br>
                <span class="blind__s">${r.blind} of ${r.n} answered &mdash; ${Math.round(r.blind/r.n*100)}% of the room</span></span>
            </div>`).join(''):`<p class="emptyline">${totalAns?'None. Where the room was confident, it was right.':'No answers recorded yet.'}</p>`}
        </div>

        <div class="panel">
          <h4>How the room splits</h4>
          <p class="sub">Each person by their own correct rate. A few low scores is coaching; a flat spread is a training gap.</p>
          ${nPeople?buckets.map(b=>`
            <div class="split__row">
              <span class="split__lbl">${b.lab}</span>
              <span class="split__track"><i style="width:${(b.n/bMax*100).toFixed(0)}%;background:${b.col}"></i></span>
              <span class="split__n">${b.n} ${b.n===1?'person':'people'}</span>
            </div>`).join(''):'<p class="emptyline">No participants yet.</p>'}
        </div>
      </div>
    </div>

    <div class="sec sec__split">
      <div>
        <div class="sec__hd"><h3>What is slowing them down</h3><span class="s">Self-reported, across every tool.</span></div>
        ${friList.length?friList.map(f=>`
          <div class="pp">
            <span class="pp__lbl">${esc(f[0])}</span>
            <span class="pp__track"><i style="width:${(f[1]/friMax*100).toFixed(0)}%"></i></span>
            <span class="pp__n">${f[1]}</span>
          </div>`).join(''):'<p class="emptyline">Nothing reported.</p>'}
      </div>
      <div>
        <div class="sec__hd"><h3>In their words</h3></div>
        ${notes.length?`<div class="quotes">${notes.map(n=>`
          <div class="quote"><b>${esc(byId(n.tool)?byId(n.tool).name:'')} &middot; ${esc(n.name||'anonymous')}</b>${esc(n.note)}</div>`).join('')}</div>`
          :'<p class="emptyline">No written comments this session.</p>'}
      </div>
    </div>`;
  document.body.appendChild(s);

  $('#sumClose',s).onclick=()=>s.remove();
  $('#sumCsv',s).onclick=()=>exportCsv(list,responses,room);
  $('#sumPrint',s).onclick=()=>window.print();
  $('#sumCopy',s).onclick=()=>copyPlan(rows,ranked,room,{nPeople,totalAns,overall,avgConf,blindTotal,verdict});
}

/* Plain-text training plan for pasting into an email or a ticket. */
function copyPlan(rows,ranked,room,k){
  const L=[];
  L.push('PROCORE FOREMAN CHECK \u2014 TRAINING SUMMARY');
  L.push('Session '+room+'  \u00b7  '+new Date().toLocaleDateString());
  L.push('');
  L.push(k.nPeople+' participants  \u00b7  '+k.totalAns+' answers  \u00b7  '+
    (k.totalAns?Math.round(k.overall*100):0)+'% correct  \u00b7  avg confidence '+
    (k.totalAns?k.avgConf.toFixed(1):'0')+'/5  \u00b7  '+k.blindTotal+' blind spots');
  L.push('');
  L.push(k.verdict);
  L.push('');
  L.push('WHERE TO START');
  L.push('');
  ranked.forEach((r,i)=>{
    L.push((i+1)+'. '+r.t.name.toUpperCase()+'  ['+r.tagTxt.toUpperCase()+']');
    L.push('   '+Math.round(r.score*100)+'% correct  \u00b7  confidence '+r.conf.toFixed(1)+'/5  \u00b7  '+
      r.n+' answered'+(r.blind?'  \u00b7  '+r.blind+' blind spot'+(r.blind===1?'':'s'):''));
    L.push('   '+r.action);
    if(r.topWrong!=null){
      L.push('   Most common wrong answer ('+r.topWrongN+' of '+r.n+'): '+r.t.opts[r.topWrong]);
      L.push('   Correct: '+r.t.opts[r.t.ans]);
    }
    L.push('');
  });
  const txt=L.join('\n');
  const done=()=>toast('Training plan copied \u2014 paste it anywhere.');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done,()=>fallback());
  } else fallback();
  function fallback(){
    const ta=el('textarea'); ta.value=txt;
    ta.style.cssText='position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }
    catch(e){ toast('Could not copy automatically \u2014 use Export CSV instead.'); }
    ta.remove();
  }
}

function exportCsv(list,responses,room){
  const head=['tool','circuit','respondent','confidence_1_5','answered_correctly','friction','note','timestamp'];
  const lines=[head.join(',')];
  responses.forEach(r=>{
    const t=byId(r.tool); const i=list.findIndex(x=>x.id===r.tool)+1;
    const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
    lines.push([q(t?t.name:r.tool),i,q(r.name||'anonymous'),r.conf,r.correct?'yes':'no',
      q((r.friction||[]).join('; ')),q(r.note||''),q(new Date(r.ts).toISOString())].join(','));
  });
  const blob=new Blob([lines.join('\n')],{type:'text/csv'});
  const a=el('a'); a.href=URL.createObjectURL(blob); a.download='panel-check-'+room+'.csv';
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},400);
  toast('CSV downloaded.');
}

/* ================================================================
   CREW (phone)
   ================================================================ */
function renderCrew(p){
  const room=(p.c||'').toUpperCase();
  const ids=(p.t||'').split(',').filter(Boolean);
  const list=(ids.length?ids:TOOLS.map(t=>t.id)).map(byId).filter(Boolean);
  const cfg={mode:p.m||'mqtt',fbUrl:p.f||''};   // transport rides in the QR, not localStorage
  const KEY='pc:me:'+room;
  const me=store.get(KEY,{pid:'p'+Math.random().toString(36).slice(2,9),name:'',done:{}});
  store.set(KEY,me);

  Relay.init({mode:cfg.mode,room,fbUrl:cfg.fbUrl,onMessage:()=>{},onLink:()=>{}});

  const app=$('#app'); app.className='';
  const shell=()=>`
    <div class="cv">
      <div class="cv__hd">
        <span class="brandmark brandmark--crew" role="img" aria-label="Arden Engineering Constructors"></span>
        <span class="rm">${esc(room)}</span>
      </div>
      <div id="cvBody"></div>
    </div>`;
  app.innerHTML=shell();

  function nameGate(next){
    $('#cvBody').innerHTML=`
      <h1>Before<br>you start</h1>
      <p class="cv__note">First name or nickname — it shows on the big screen when your answer lands. Leave it blank to stay anonymous. You&rsquo;ll only be asked once.</p>
      <div class="field"><label for="nm">Name</label><input id="nm" autocomplete="given-name" placeholder="e.g. Ruiz" value="${esc(me.name)}"></div>
      <button class="btn btn--go cv__submit" id="goName">Start</button>`;
    $('#goName').onclick=()=>{ me.name=$('#nm').value.trim().slice(0,18); store.set(KEY,me); next(); };
    $('#nm').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#goName').click(); });
  }

  // No browsable tool list: the presenter sets the pace, and each tool has its
  // own QR. Landing here without a tool just means "wait for the next code".
  function waiting(){
    const doneN=list.filter(t=>me.done[t.id]).length;
    $('#cvBody').innerHTML=`
      <h1>Ready</h1>
      <p class="cv__note">Scan the code on the screen to start. After that you&rsquo;ll move through the tools with a button &mdash; no more scanning.</p>
      <div class="waitcue" style="border-top:none;padding-top:0;margin-top:26px">
        <div class="t">Waiting for the next code</div>
        <div class="s">${doneN?doneN+' answered so far. Nice work.':'Nothing answered yet.'}</div>
        <div class="dots"><i></i><i></i><i></i></div>
      </div>
      <p class="hint" style="margin-top:26px;text-align:center">Signed in as <b>${esc(me.name||'anonymous')}</b> · <button class="btn btn--sm btn--ghost" id="rename" style="padding:4px 9px">change</button></p>`;
    $('#rename').onclick=()=>nameGate(waiting);
  }

  function survey(t){
    const prev=me.done[t.id]||{};
    let conf=prev.conf||0, ans=prev.ans==null?-1:prev.ans, fr=new Set(prev.friction||[]);
    const pos=list.findIndex(x=>x.id===t.id)+1;
    $('#cvBody').innerHTML=`
      <div class="cvprog">
        <span class="cvprog__n">TOOL ${String(pos).padStart(2,'0')} / ${String(list.length).padStart(2,'0')}</span>
        <span class="cvprog__track"><i style="width:${(pos/list.length*100).toFixed(0)}%"></i></span>
      </div>
      <h1>${esc(t.name)}</h1>
      <p class="cv__note">${esc(t.note)}</p>

      <div class="q">
        <h2 class="q__ttl"><i>01</i> How well do you know it?</h2>
        <div class="scale" id="qConf">${CONF.map(c=>`
          <button type="button" data-v="${c.n}" aria-pressed="false"><span class="n">${c.n}</span><span class="t">${c.t}</span></button>`).join('')}</div>
      </div>

      <div class="q">
        <h2 class="q__ttl"><i>02</i> Quick check</h2>
        <p class="q__sub">${esc(t.q)}</p>
        <div id="qAns">${t.opts.map((o,i)=>`
          <button type="button" class="opt" data-i="${i}" aria-pressed="false">
            <span class="key">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
      </div>

      <div class="q">
        <h2 class="q__ttl"><i>03</i> What slows you down here?</h2>
        <p class="q__sub">Tap all that apply.</p>
        <div class="chips" id="qFric">${FRICTION.map(f=>`
          <button type="button" class="chip" data-f="${esc(f)}" aria-pressed="false">${esc(f)}</button>`).join('')}</div>
      </div>

      <div class="q">
        <h2 class="q__ttl"><i>04</i> Anything else? <span style="font-family:var(--body);font-weight:400;text-transform:none;letter-spacing:0;font-size:13px;color:#5f7085">optional</span></h2>
        <textarea id="qNote" maxlength="220" placeholder="One thing about ${esc(t.name)} you wish somebody had shown you.">${esc(prev.note||'')}</textarea>
      </div>

      <button class="btn btn--go cv__submit" id="send">Send it</button>`;

    const setPressed=(sel,pred)=>$$(sel).forEach(b=>b.setAttribute('aria-pressed',pred(b)));
    $$('#qConf button').forEach(b=>b.onclick=()=>{ conf=+b.dataset.v; setPressed('#qConf button',x=>+x.dataset.v===conf); });
    $$('#qAns .opt').forEach(b=>b.onclick=()=>{ ans=+b.dataset.i; setPressed('#qAns .opt',x=>+x.dataset.i===ans); });
    $$('#qFric .chip').forEach(b=>b.onclick=()=>{ const f=b.dataset.f; fr.has(f)?fr.delete(f):fr.add(f); b.setAttribute('aria-pressed',fr.has(f)); });
    if(conf) setPressed('#qConf button',x=>+x.dataset.v===conf);
    if(ans>=0) setPressed('#qAns .opt',x=>+x.dataset.i===ans);
    $$('#qFric .chip').forEach(b=>{ if(fr.has(b.dataset.f)) b.setAttribute('aria-pressed','true'); });

    $('#send').onclick=async()=>{
      if(!conf) return toast('Pick how well you know it first.');
      if(ans<0) return toast('Take a swing at the quick check.');
      const payload={pid:me.pid,name:me.name||'',tool:t.id,conf,ans,correct:ans===t.ans,
        friction:Array.from(fr),note:$('#qNote').value.trim().slice(0,220),ts:Date.now()};
      $('#send').textContent='Sending…'; $('#send').disabled=true;
      const ok=await Relay.send(payload);
      me.done[t.id]={conf,ans,friction:payload.friction,note:payload.note}; store.set(KEY,me);
      result(t,payload,ok);
    };
  }

  function result(t,payload,ok){
    const right=payload.correct;
    // Advance in the presenter's tool order. The person moves themselves; the
    // presenter drives the big screen, so the counter keeps them in sync.
    const pos=list.findIndex(x=>x.id===t.id)+1;
    const nextTool=list[pos] || null;
    const mine=t.opts[payload.ans];
    const correct=t.opts[t.ans];
    // Rated themselves confident but missed it — the gap worth naming.
    const cocky = !right && payload.conf>=4;

    $('#cvBody').innerHTML=`
      <div class="done-card">
        <div style="color:${right?'var(--ground)':'var(--trip)'};width:46px;margin:0 auto">${I.bolt}</div>
        <div class="big">${right?'Correct':'Not quite'}</div>
        <div class="verdict tag ${right?'tag--ok':'tag--trip'}">${esc(t.name)} · answer recorded</div>

        <div class="recap">
          <div class="recap__q"><b>The question</b>${esc(t.q)}</div>

          <div class="ansrow ${right?'ansrow--right':'ansrow--wrong'}">
            <span class="mk">${right?'&#10003;':'&#10007;'}</span>
            <span><span class="ansrow__lab">You answered</span>${esc(mine)}</span>
          </div>

          ${right?'':`
          <div class="ansrow ansrow--key">
            <span class="mk">&#10003;</span>
            <span><span class="ansrow__lab">The correct answer</span>${esc(correct)}</span>
          </div>`}

          <div class="why"><b>${right?'Why that&rsquo;s right':'Why'}</b>${esc(t.why)}</div>

          ${right?'':`<div class="why why--more"><b>Worth knowing</b>${esc(t.more||'')}</div>`}

          ${cocky?`<div class="selfnote">You rated your knowledge of ${esc(t.name)} a ${payload.conf} out of 5 on this one. Worth a second look &mdash; this is exactly the kind of gap that&rsquo;s easy to carry onto a job without noticing.</div>`:''}
        </div>

        ${ok==='queued'?'<p class="hint" style="color:var(--warn);margin-top:16px">Saved on your phone — it will send as soon as the connection comes back.</p>':''}
        ${ok===false?'<p class="hint" style="color:var(--trip);margin-top:16px">Could not reach the screen. Your answer is saved here — let the presenter know.</p>':''}

        ${nextTool
          ? `<button class="btn btn--go cv__submit btn--next" id="nextTool">Next: ${esc(nextTool.name)}
               <span class="sub">Tool ${pos+1} of ${list.length} &middot; follow the big screen</span></button>`
          : `<div class="waitcue">
               <div class="t">That&rsquo;s all of them</div>
               <div class="s">You&rsquo;ve answered every tool. Nice work &mdash; watch the big screen for the results.</div>
               <div class="dots"><i></i><i></i><i></i></div>
             </div>`}
      </div>`;
    if($('#nextTool')) $('#nextTool').onclick=()=>survey(nextTool);
    window.scrollTo(0,0);
  }

  if(!me.name && !Object.keys(me.done).length) nameGate(()=>{ p.go&&byId(p.go)?survey(byId(p.go)):waiting(); });
  else if(p.go&&byId(p.go)) survey(byId(p.go));
  else waiting();
}

route();
</script>
